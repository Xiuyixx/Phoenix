<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phoenix</title><style>/*CSS*/</style></head><body><main class="shell"><header><div class="brand"><span class="logo">✦</span><div><h1>Phoenix</h1><p>CLIProxyAPI 额度守护</p></div></div><span id="state" class="pill">加载中</span></header><nav><button class="tab active" data-view="quota">额度</button><button class="tab" data-view="settings">设置</button></nav><section id="quota" class="view"><div class="toolbar"><div><h2>账号额度</h2><p class="muted">监控窗口、错误状态与自动操作</p></div><button id="refresh" class="button secondary">立即刷新</button></div><div id="accounts" class="cards"></div><div class="card"><div class="toolbar"><div><h2>自动操作</h2><p class="muted">手动操作会记录到 CPA 日志</p></div></div><div class="actions"><button id="reset" class="button danger">立即重置</button><button id="ignite" class="button primary">立即点火</button></div><p id="action-status" class="hint"></p></div><div class="card"><h2>最近事件</h2><div id="events" class="events"></div></div></section><section id="settings" class="view" hidden><div class="card"><h2>Telegram 推送</h2><p class="muted">账号停用、认证失败和其他 CPA 账号错误会立即推送。</p><label>Bot Token<input id="bot-token" type="password" autocomplete="off" placeholder="123456:ABC..."></label><label>Chat ID（多个用分号分隔）<input id="chat-ids" placeholder="123456789;987654321"></label><label class="check"><input id="telegram-enabled" type="checkbox">启用 Telegram 推送</label><button id="test" class="button secondary">测试推送</button></div><div class="card"><h2>自动重置</h2><p class="muted">订阅渠道周用量窗口耗尽，并且账号持有 reset credit 时，自动消耗一张 credit，随后清除 CPA 对该凭证的本地冷却。</p><label class="check"><input id="reset-enabled" type="checkbox">启用自动重置</label><label class="check"><input id="weekly-only" type="checkbox">仅处理周用量窗口</label><label>最低剩余重置时间（秒）<input id="min-reset" type="number" min="0"></label><p class="hint">建议保持“仅处理周用量窗口”开启，避免误消耗 reset credit。</p></div><div class="card"><h2>自动点火</h2><label class="check"><input id="ignition-enabled" type="checkbox">启用自动点火</label><div class="grid"><label>每日开始（时）<input id="start-hour" type="number" min="0" max="23"></label><label>每日结束（时）<input id="end-hour" type="number" min="0" max="23"></label><label>重置后延迟（秒）<input id="grace" type="number" min="0"></label></div></div></section></main><script>/*JS*/</script></body></html>
